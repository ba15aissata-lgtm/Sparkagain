name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/daily-habits-organizing-app-9dhrxl
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Sparkagain (habit tracker) — published at the site root.
      - run: npm ci
      - run: npm run build

      # ChoreStars (family chores) — published at /chorestars/, alongside it.
      - run: npm ci
        working-directory: chorestars
      - run: npm run build
        working-directory: chorestars

      # Défis (personal challenge tracker) — published at /defis/.
      - run: npm ci
        working-directory: defis
      - run: npm run build
        working-directory: defis

      - name: Combine all apps into one publish folder
        run: |
          rm -rf site
          mkdir -p site/chorestars site/defis
          cp -r dist/. site/
          cp -r chorestars/dist/. site/chorestars/
          cp -r defis/dist/. site/defis/

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
